cat << 'EOF' > layouts/shortcodes/ghcontributors.html
<div class="ghContributors">
  {{ $url := .Get 0 }}
  {{ $data := resources.GetRemote $url }}
  {{ if $data }}
    {{ range ($data | transform.Unmarshal) }}
    <div>
      <img
        src="{{.avatar_url}}"
        class="inline"
        width="32"
        height="32"
        style="
          height: 32px;
          margin-bottom: 0.25em;
          vertical-align: middle;
        "
      />
      <label><a href="{{.html_url}}">@{{.login}}</a></label>
      <span class="contributions">{{.contributions}} commits</span>
    </div>
    {{ end }}
  {{ end }}
</div>
EOF
